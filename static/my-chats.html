<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanTrace — My Chats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0c2340; --blue: #1a3c5e; --accent: #2563eb;
      --g50: #f8fafc; --g100: #f1f5f9; --g200: #e2e8f0; --g400: #94a3b8;
      --g600: #475569; --g700: #334155; --g900: #0f172a;
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--g100); color: var(--g900); min-height: 100vh; }
    header {
      background: var(--navy); color: #fff; padding: 0 40px; height: 64px;
      display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; color: #fff; text-decoration: none; }
    .logo-icon { width: 34px; height: 34px; background: rgba(255,255,255,.15); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
    .header-actions { display: flex; align-items: center; gap: 14px; font-size: 13.5px; }
    .header-actions a, .header-actions button {
      color: rgba(255,255,255,.75); text-decoration: none; background: none; border: none;
      font-family: inherit; font-size: 13.5px; cursor: pointer;
    }
    .header-actions a:hover, .header-actions button:hover { color: #fff; }
    .main { max-width: 760px; margin: 0 auto; padding: 32px 20px 100px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .sub { font-size: 13.5px; color: var(--g400); margin-bottom: 24px; }
    .session-list { display: flex; flex-direction: column; gap: 10px; }
    .session-card {
      background: #fff; border-radius: 14px; padding: 16px 20px; cursor: pointer;
      box-shadow: 0 1px 6px rgba(0,0,0,.05); transition: box-shadow .15s;
    }
    .session-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .session-label { font-size: 14.5px; font-weight: 600; color: var(--g900); margin-bottom: 4px; }
    .session-meta { font-size: 12px; color: var(--g400); }
    .empty { text-align: center; padding: 60px 20px; color: var(--g400); }
    .transcript { display: none; }
    .transcript.open { display: block; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-size: 13.5px; font-weight: 600; margin-bottom: 16px; cursor: pointer; }
    .msg { margin-bottom: 14px; }
    .msg-role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--g400); margin-bottom: 4px; }
    .msg-body { background: #fff; border-radius: 12px; padding: 12px 16px; font-size: 14px; line-height: 1.55; }
    .msg.user .msg-body { background: var(--accent); color: #fff; }
    .msg-body p { margin-bottom: 8px; }
    .msg-body p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
<header>
  <a href="/" class="logo"><div class="logo-icon">🏙️</div>UrbanTrace</a>
  <div class="header-actions">
    <span id="username-label"></span>
    <a href="/">Search</a>
    <button onclick="signOut()">Sign out</button>
  </div>
</header>

<main class="main">
  <div id="list-view">
    <h1>My Chats</h1>
    <div class="sub">Your past conversations with Brick.</div>
    <div class="session-list" id="session-list"></div>
  </div>

  <div id="detail-view" class="transcript">
    <a class="back-link" onclick="showList()">← Back to My Chats</a>
    <div id="transcript-msgs"></div>
  </div>
</main>

<script>
  marked.setOptions({ breaks: true, gfm: true });

  async function init() {
    const me = await fetch('/api/me').then(r => r.json());
    if (!me.authenticated) { location.href = '/login'; return; }
    document.getElementById('username-label').textContent = me.username;

    const res = await fetch('/api/my-chats');
    const data = await res.json();
    const list = document.getElementById('session-list');
    if (!data.sessions.length) {
      list.innerHTML = '<div class="empty">No chats yet — ask Brick something on the Search page.</div>';
      return;
    }
    list.innerHTML = data.sessions.map(s => `
      <div class="session-card" onclick="openSession('${s.id}')">
        <div class="session-label">${escapeHtml(s.label || 'New conversation')}</div>
        <div class="session-meta">${s.message_count} messages · ${new Date(s.last_active_at).toLocaleString()}</div>
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function openSession(id) {
    const res = await fetch(`/api/my-chats/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    renderTranscript(data.messages);
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('detail-view').classList.add('open');
  }

  function renderTranscript(messages) {
    const el = document.getElementById('transcript-msgs');
    // User-submitted content is always rendered via textContent, never markdown/innerHTML —
    // only the assistant's own model-generated replies go through marked.parse().
    el.innerHTML = '';
    messages.forEach(m => {
      const row = document.createElement('div');
      row.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
      const label = document.createElement('div');
      label.className = 'msg-role';
      label.textContent = m.role === 'user' ? 'You' : 'Brick';
      const body = document.createElement('div');
      body.className = 'msg-body';
      if (m.role === 'user') {
        body.textContent = m.content;
      } else {
        body.innerHTML = marked.parse(m.content);
      }
      row.appendChild(label);
      row.appendChild(body);
      el.appendChild(row);
    });
  }

  function showList() {
    document.getElementById('detail-view').classList.remove('open');
    document.getElementById('list-view').style.display = 'block';
  }

  async function signOut() {
    await fetch('/auth/logout', { method: 'POST' });
    location.href = '/';
  }

  init();
</script>
</body>
</html>
