<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanTrace — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0c2340; --blue: #1a3c5e; --accent: #2563eb;
      --g50: #f8fafc; --g100: #f1f5f9; --g200: #e2e8f0; --g400: #94a3b8;
      --g600: #475569; --g700: #334155; --g900: #0f172a;
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--g100); color: var(--g900); min-height: 100vh; }
    header {
      background: var(--navy); color: #fff; padding: 0 40px; height: 64px;
      display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; color: #fff; text-decoration: none; }
    .logo-icon { width: 34px; height: 34px; background: rgba(255,255,255,.15); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
    .admin-badge { background: #7c3aed; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-left: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .header-actions { display: flex; align-items: center; gap: 14px; font-size: 13.5px; }
    .header-actions a, .header-actions button {
      color: rgba(255,255,255,.75); text-decoration: none; background: none; border: none;
      font-family: inherit; font-size: 13.5px; cursor: pointer;
    }
    .header-actions a:hover, .header-actions button:hover { color: #fff; }
    .main { max-width: 900px; margin: 0 auto; padding: 32px 20px 100px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .sub { font-size: 13.5px; color: var(--g400); margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.05); }
    th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--g400); padding: 12px 16px; border-bottom: 1px solid var(--g200); }
    td { padding: 12px 16px; font-size: 13.5px; border-bottom: 1px solid var(--g100); }
    tr:last-child td { border-bottom: none; }
    tr.session-row { cursor: pointer; transition: background .15s; }
    tr.session-row:hover { background: var(--g50); }
    .who-badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; }
    .who-guest { background: var(--g100); color: var(--g600); }
    .who-user { background: #dbeafe; color: #1e40af; }
    .empty { text-align: center; padding: 60px 20px; color: var(--g400); }
    .transcript { display: none; }
    .transcript.open { display: block; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-size: 13.5px; font-weight: 600; margin-bottom: 16px; cursor: pointer; }
    .msg { margin-bottom: 14px; }
    .msg-role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--g400); margin-bottom: 4px; }
    .msg-body { background: #fff; border-radius: 12px; padding: 12px 16px; font-size: 14px; line-height: 1.55; }
    .msg.user .msg-body { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
<header>
  <a href="/" class="logo"><div class="logo-icon">🏙️</div>UrbanTrace<span class="admin-badge">Admin</span></a>
  <div class="header-actions">
    <a href="/">Search</a>
    <button onclick="signOut()">Sign out</button>
  </div>
</header>

<main class="main">
  <div id="list-view">
    <h1>All Chat Sessions</h1>
    <div class="sub">Every conversation across all users and guests.</div>
    <table id="session-table" style="display:none">
      <thead>
        <tr><th>User</th><th>Preview</th><th>Messages</th><th>Last active</th></tr>
      </thead>
      <tbody id="session-tbody"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none">No chat sessions yet.</div>
  </div>

  <div id="detail-view" class="transcript">
    <a class="back-link" onclick="showList()">← Back to all sessions</a>
    <div id="transcript-msgs"></div>
  </div>
</main>

<script>
  marked.setOptions({ breaks: true, gfm: true });

  async function init() {
    const me = await fetch('/api/me').then(r => r.json());
    if (!me.authenticated || me.role !== 'admin') { location.href = '/login'; return; }

    const res = await fetch('/api/admin/sessions');
    if (!res.ok) { location.href = '/login'; return; }
    const data = await res.json();
    const tbody = document.getElementById('session-tbody');
    if (!data.sessions.length) {
      document.getElementById('empty-msg').style.display = 'block';
      return;
    }
    document.getElementById('session-table').style.display = 'table';
    tbody.innerHTML = data.sessions.map(s => `
      <tr class="session-row" onclick="openSession('${s.id}')">
        <td>${s.username
          ? `<span class="who-badge who-user">${escapeHtml(s.username)}</span>`
          : `<span class="who-badge who-guest">Guest</span>`}</td>
        <td>${escapeHtml(s.label || '(no messages)')}</td>
        <td>${s.message_count}</td>
        <td>${new Date(s.last_active_at).toLocaleString()}</td>
      </tr>
    `).join('');
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function openSession(id) {
    const res = await fetch(`/api/admin/sessions/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    renderTranscript(data.messages);
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('detail-view').classList.add('open');
  }

  function renderTranscript(messages) {
    const el = document.getElementById('transcript-msgs');
    // Stored user content is always plain textContent, never markdown/innerHTML —
    // guarding against a guest/user embedding HTML/script in a chat message that
    // an admin later views. Only assistant replies go through marked.parse().
    el.innerHTML = '';
    messages.forEach(m => {
      const row = document.createElement('div');
      row.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
      const label = document.createElement('div');
      label.className = 'msg-role';
      label.textContent = m.role === 'user' ? 'User' : 'Brick';
      const body = document.createElement('div');
      body.className = 'msg-body';
      if (m.role === 'user') {
        body.textContent = m.content;
      } else {
        body.innerHTML = marked.parse(m.content);
      }
      row.appendChild(label);
      row.appendChild(body);
      el.appendChild(row);
    });
  }

  function showList() {
    document.getElementById('detail-view').classList.remove('open');
    document.getElementById('list-view').style.display = 'block';
  }

  async function signOut() {
    await fetch('/auth/logout', { method: 'POST' });
    location.href = '/';
  }

  init();
</script>
</body>
</html>
